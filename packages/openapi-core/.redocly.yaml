apis:
  identity:
    root: src/identity.yaml
  applications:
    root: src/applications.yaml
  policies:
    root: src/policies.yaml
  referrals:
    root: src/referrals.yaml
  early-warnings:
    root: src/early-warnings.yaml
  models:
    root: src/models.yaml
  audits:
    root: src/audits.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
