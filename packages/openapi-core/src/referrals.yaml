openapi: 3.1.0
info:
  title: Lendora Referrals API
  version: 0.1.0
  description: Underwriter refer queue, claim, fact-pack mirror, and overrides.
  x-domain: ref
  x-domain-prefix: REF
  license:
    name: Proprietary
servers:
  - url: https://api.lendora.local
security:
  - bearerAuth: []
tags:
  - name: ReferTasks
  - name: Overrides
paths:
  /v1/refer-tasks:
    get:
      operationId: listReferTasks
      summary: List Refer Tasks
      tags: [ReferTasks]
      x-repository: ReferTask
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskStatus
        - name: productLine
          in: query
          schema:
            type: string
            enum: [personal, sme]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/refer-tasks/{referTaskId}:
    parameters:
      - name: referTaskId
        in: path
        required: true
        schema:
          $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskId
    get:
      operationId: getReferTask
      summary: Get Refer Task
      tags: [ReferTasks]
      x-repository: ReferTask
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/refer-tasks/{referTaskId}/claim:
    parameters:
      - name: referTaskId
        in: path
        required: true
        schema:
          $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskId
    post:
      operationId: claimReferTask
      summary: Claim Refer Task
      tags: [ReferTasks]
      x-repository: ReferTask
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema:
                $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/refer-tasks/{referTaskId}/overrides:
    parameters:
      - name: referTaskId
        in: path
        required: true
        schema:
          $ref: ./referrals.schemas.yaml#/components/schemas/ReferTaskId
    post:
      operationId: createOverride
      summary: Create Override
      tags: [Overrides]
      x-repository: Override
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./referrals.schemas.yaml#/components/schemas/OverrideCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./referrals.schemas.yaml#/components/schemas/OverrideResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
