openapi: 3.1.0
info:
  title: Lendora Models API
  version: 0.1.0
  description: Champion/challenger models and learning envelope governance.
  x-domain: mdl
  x-domain-prefix: MDL
  license:
    name: Proprietary
servers:
  - url: https://api.lendora.local
security:
  - bearerAuth: []
tags:
  - name: Models
  - name: LearningEnvelopes
paths:
  /v1/models:
    get:
      operationId: listCreditModels
      summary: List Credit Models
      tags: [Models]
      x-repository: ModelVersion
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: role
          in: query
          schema:
            $ref: ./models.schemas.yaml#/components/schemas/ModelRole
        - name: status
          in: query
          schema:
            $ref: ./models.schemas.yaml#/components/schemas/ModelStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/ModelVersionListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerChallengerModel
      summary: Register Challenger Model
      tags: [Models]
      x-repository: ModelVersion
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./models.schemas.yaml#/components/schemas/ModelVersionCreate
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/ModelVersionResponse
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/models/{modelVersionId}:
    parameters:
      - name: modelVersionId
        in: path
        required: true
        schema:
          $ref: ./models.schemas.yaml#/components/schemas/ModelVersionId
    get:
      operationId: getCreditModel
      summary: Get Credit Model
      tags: [Models]
      x-repository: ModelVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/ModelVersionResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/models/{modelVersionId}/propose-promote:
    parameters:
      - name: modelVersionId
        in: path
        required: true
        schema:
          $ref: ./models.schemas.yaml#/components/schemas/ModelVersionId
    post:
      operationId: proposePromoteModel
      summary: Propose Promote Model
      tags: [Models]
      x-repository: ModelVersion
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Promotion proposed
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/ModelVersionResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/models/{modelVersionId}/approve-promote:
    parameters:
      - name: modelVersionId
        in: path
        required: true
        schema:
          $ref: ./models.schemas.yaml#/components/schemas/ModelVersionId
    post:
      operationId: approvePromoteModel
      summary: Approve Promote Model
      tags: [Models]
      x-repository: ModelVersion
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Dual-approved / promoted when complete
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/ModelVersionResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/learning-envelopes/current:
    get:
      operationId: getCurrentLearningEnvelope
      summary: Get Current Learning Envelope
      tags: [LearningEnvelopes]
      x-repository: LearningEnvelope
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/LearningEnvelopeResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    patch:
      operationId: updateCurrentLearningEnvelope
      summary: Update Current Learning Envelope
      tags: [LearningEnvelopes]
      x-repository: LearningEnvelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./models.schemas.yaml#/components/schemas/LearningEnvelopeUpdate
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: ./models.schemas.yaml#/components/schemas/LearningEnvelopeResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
